async function adminView(){$('m').innerHTML='<div class="card"><h2>⚙️ Admin — Users</h2><div id="ul" class="ts">Loading…</div></div>';
try{const q=await getDocs(collection(fs,'users'));const L=[];q.forEach(d=>L.push({id:d.id,...d.data()}));const o={pending:0,approved:1,blocked:2};L.sort((a,b)=>o[a.status]-o[b.status]||(b.createdAt||0)-(a.createdAt||0));
$('ul').innerHTML=L.map(u=>`<div class="ur"><div style="min-width:0"><b>${esc(u.name)}</b><div class="ts">${esc(u.email)} • ${new Date(u.createdAt||0).toLocaleString('en-GB')}</div></div><div class="act2"><span class="st ${u.status}">${u.status}</span>${u.id==U.uid?'':(u.status!='approved'?`<button class="g" onclick="setSt('${u.id}','approved')">Approve</button>`:'')+(u.status!='blocked'?`<button class="d" onclick="setSt('${u.id}','blocked')">Block</button>`:'')}</div></div>`).join('')||'No users yet.'}catch(e){$('ul').textContent='Could not load users.'}}
async function setSt(id,s){if(!confirm((s=='approved'?'Approve':'Block')+' this user?'))return;try{await updateDoc(doc(fs,'users',id),{status:s})}catch(e){return alert('Could not update. Please try again.')}adminView()}
function inp(f){const k=f[0],t=f[2],o=f[3],id='f_'+k;
if(t=='sel')return `<select id="${id}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`;
if(t=='ta')return `<textarea id="${id}" rows="3"></textarea>`;
if(t=='num')return `<input id="${id}" inputmode="numeric" maxlength="${o[1]}" placeholder="Numbers only (${o[0]==o[1]?o[0]:o[0]+'-'+o[1]} digits)" oninput="this.value=this.value.replace(/\\D/g,'')">`;
if(t=='alpha')return `<input id="${id}" placeholder="Letters only" oninput="this.value=this.value.replace(/[^\\p{L}\\s.'-]/gu,'')">`;
return `<input id="${id}">`}
const nowLocal=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
function section(s){const c=S[s];let tabs='';
if(s=='members')tabs=`<div class="tabs">${db.parties.map((p,i)=>`<button class="${p==party?'g':'o'}" onclick="setParty(${i})">${esc(p)}</button>`).join('')}<button class="o" onclick="addParty()">+ New Party</button>${isCustom(party)?`<button class="d" onclick="removeParty()">🗑 Remove ${esc(party)}</button>`:''}</div>`;
const rows=db[s].filter(r=>s!='members'||r.party==party);
$('m').innerHTML=`<div class="card"><h2>${c.title}${s=='members'?' — '+esc(party):''}</h2>${tabs}<div class="form">${c.f.map(f=>`<div class="${f[2]=='ta'?'wide':''}"><label>${f[1]}</label>${inp(f)}</div>`).join('')}<div><label>Date &amp; Time of Information</label><input type="datetime-local" id="f_infoDate" value="${nowLocal()}"></div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="g" onclick="add('${s}')">💾 Save</button><button onclick="upload('${s}')">☁️ Upload to Drive</button></div></div>
<div class="card"><h2>Saved Records (${rows.length})</h2><div class="tw"><table><tr><th>#</th>${c.f.map(f=>`<th>${f[1]}</th>`).join('')}<th>Info Date</th><th>Saved On</th><th>Drive</th><th></th></tr>${rows.map((r,i)=>`<tr><td class="num" data-label="#">${i+1}</td>${c.f.map(f=>`<td class="${f[0]=='name'?'nm':f[0]=='role'?'chip':f[0]=='active'?'act '+(r.active=='Active'?'on':'off'):(f[0]=='address'||f[0]=='desc')?'wide':''}" data-label="${f[1]}">${esc(r[f[0]])}</td>`).join('')}<td class="ts meta" data-label="Info Date">${esc((r.infoDate||'').replace('T',' '))}</td><td class="ts meta" data-label="Saved On">${esc(r.at)}</td><td class="ts drv" data-label="Drive">${esc(r.sync||'Saved')}</td><td class="del" data-label=""><button class="d" onclick="del('${s}','${r.id}')">✕</button></td></tr>`).join('')||`<tr><td colspan="${c.f.length+5}" class="ts">No records yet.</td></tr>`}</table></div></div>`}
async function add(s){const r={uid:U.uid,section:s,at:now(),ts:Date.now(),sync:'Saved'};let any=false;
for(const f of S[s].f){const v=$('f_'+f[0]).value.trim();r[f[0]]=v;if(v&&f[2]!='sel')any=true;
if(f[2]=='num'&&v&&(v.length<f[3][0]||v.length>f[3][1]))return alert(f[1]+' must be '+(f[3][0]==f[3][1]?f[3][0]:f[3][0]+' to '+f[3][1])+' digits.')}
r.infoDate=$('f_infoDate').value;if(!r.infoDate)return alert('Please select the date and time of the information.');
if(!any)return alert('Please fill in at least one field.');if(s=='members')r.party=party;
try{r.id=(await addDoc(collection(fs,'records'),r)).id}catch(e){return alert('Could not save. Please check your connection and try again.')}
db[s].push(r);await logA(S[s].title,'Saved: '+(r.name||'record'));section(s)}
async function upload(s){const p=db[s].filter(r=>(r.sync||'Saved')=='Saved'&&(s!='members'||r.party==party));
if(!p.length)return alert('No saved records are waiting to be uploaded.');
try{await Promise.all(p.map(r=>updateDoc(doc(fs,'records',r.id),{sync:'Pending Drive upload'})))}catch(e){return alert('Could not update. Please try again.')}
p.forEach(r=>r.sync='Pending Drive upload');await logA(S[s].title,'Upload requested: '+p.length+' record(s)');section(s);
alert('Google Drive is not connected yet, so nothing was uploaded. '+p.length+' record(s) are marked "Pending Drive upload" and will be sent to Drive once the Drive upload is connected.')}
async function del(s,id){if(!confirm('Are you sure you want to delete this record?'))return;
try{await deleteDoc(doc(fs,'records',id))}catch(e){return alert('Could not delete. Please try again.')}
db[s]=db[s].filter(r=>r.id!=id);await logA(S[s].title,'Deleted record');section(s)}
async function saveParties(){me.customParties=db.parties.filter(isCustom);await updateDoc(doc(fs,'users',U.uid),{customParties:me.customParties})}
async function removeParty(){if(!isCustom(party))return;const rs=db.members.filter(r=>r.party==party);
if(!confirm('Remove the party "'+party+'"'+(rs.length?' and its '+rs.length+' saved record(s)':'')+'? This cannot be undone.'))return;
try{await Promise.all(rs.map(r=>deleteDoc(doc(fs,'records',r.id))));db.members=db.members.filter(r=>r.party!=party);db.parties=db.parties.filter(x=>x!=party);await saveParties()}catch(e){return alert('Could not remove. Please try again.')}
await logA('Parties','Removed party: '+party);party=db.parties[0];shell()}
async function addParty(){const n=(prompt('Enter the name of the new party:')||'').trim();if(!n||db.parties.includes(n))return;
db.parties.push(n);try{await saveParties()}catch(e){db.parties.pop();return alert('Could not add the party. Please try again.')}
party=n;await logA('Parties','New party: '+n);shell()}
Object.assign(window,{go,setParty,doLogin,doSignup,setMode,boot,resendVerify,logout:()=>signOut(auth),add,upload,del,addParty,removeParty,setSt});
document.body.classList.add('noscroll');$('app').innerHTML='<div class="loginwrap"><div class="ts" style="color:#fff">Loading…</div></div>';
</script></body></html>
